<rect x="110" y="272" width="56" height="3" fill="#b8913a"/>
<text x="110" y="352" font-family="'Spectral',Georgia,serif" font-size="66" font-weight="700" letter-spacing="0" fill="#222">Una España unida,</text>
<text x="110" y="426" font-family="'Spectral',Georgia,serif" font-size="66" font-weight="700" letter-spacing="0" fill="#222">grande, próspera</text>
<text x="110" y="500" font-family="'Spectral',Georgia,serif" font-size="66" font-weight="700" letter-spacing="0" fill="#222">y libre.</text>
<text x="110" y="580" font-family="'Spectral',Georgia,serif" font-size="21" fill="#5a524c">La familia, el municipio y el trabajo como cimientos;</text>
<text x="110" y="614" font-family="'Spectral',Georgia,serif" font-size="21" fill="#5a524c">la ley natural como guía; el bien común como la clave</text>
<text x="110" y="648" font-family="'Spectral',Georgia,serif" font-size="21" fill="#5a524c">que lo sostiene todo.</text>
