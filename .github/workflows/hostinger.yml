# Compila la web en cada cambio de "main" y deja el resultado en la rama "hostinger".
# Hostinger publica esa rama en movimientopatriam.es automáticamente.
# Base de datos: Supabase, proyecto patriamweb. La dirección y la clave anon son públicas (las ve cualquier
# navegador); la seguridad está en las reglas (RLS) de la base de datos.
name: Publicar en Hostinger
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Cada día, para que Google tenga al día los productos, artículos y campañas nuevos (páginas y sitemap.xml)
  schedule:
    - cron: '17 4 * * *'
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://igrjdsfcecbwnawwgdop.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlncmpkc2ZjZWNid25hd3dnZG9wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1MzAwMzcsImV4cCI6MjEwODEwNjAzN30.HCT6LM_Xly-s-Z2KLlBDgxVzDWAwKKkMXzSjFub5qBc
      # Posicionamiento: una página por producto, artículo, campaña…, con sitemap.xml y robots.txt
      - run: node scripts/prerender.mjs
        env:
          VITE_SUPABASE_URL: https://igrjdsfcecbwnawwgdop.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlncmpkc2ZjZWNid25hd3dnZG9wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1MzAwMzcsImV4cCI6MjEwODEwNjAzN30.HCT6LM_Xly-s-Z2KLlBDgxVzDWAwKKkMXzSjFub5qBc
      # El boletín vive en la carpeta boletin/ del mismo alojamiento: se incluye aquí para que
      # publicar la web no lo borre (Hostinger deja la carpeta igual que la rama hostinger)
      - name: Incluir el boletín (repositorio boletin.patriam)
        run: |
          git clone --depth 1 https://github.com/patriamnews/boletin.patriam.git dist/boletin
          rm -rf dist/boletin/.git
      - name: Subir la web compilada a la rama hostinger
        run: |
          cd dist
          git init -q -b hostinger
          git config user.name "patriamnews"
          git config user.email "patriamnews@users.noreply.github.com"
          git add -A
          git commit -q -m "Web compilada desde ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" hostinger
