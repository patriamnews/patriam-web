    <script>
      // Direcciones antiguas con # (movimientopatriam.es/#/tienda): se pasan a la dirección limpia (/tienda)
      // antes de que cargue la web, conservando lo que venga detrás (p. ej. el acceso de Supabase)
      (function () {
        var h = location.hash
        if (h.indexOf('#/') !== 0) return
        var resto = h.slice(1), i = resto.indexOf('#'), extra = ''
        if (i > 0) { extra = resto.slice(i); resto = resto.slice(0, i) }
        history.replaceState(null, '', resto + extra)
      })()
    </script>
