# «España al día»: titulares de política y economía (The Objective, El Debate, La Gaceta, El Español, ABC, El Mundo, Adelante España)
# de la última semana, agrupados por noticia. Se actualiza solo cada 3 horas.
name: España al día
on:
  schedule:
    # cada 3 horas (en UTC: 0:07, 3:07, 6:07… → en Madrid 1:07, 4:07, 7:07… en invierno)
    - cron: '7 */3 * * *'
  workflow_dispatch:
  push:
    paths: ["scripts/espana-al-dia.mjs", "scripts/espana-miniaturas.mjs", "scripts/espana-pantallazos.mjs", "web/espana-asuntos.json", "web/espana-imagenes.json", "datos/espana-fuera.txt", ".github/workflows/espana-al-dia.yml"]
permissions:
  contents: write
concurrency: { group: espana-al-dia, cancel-in-progress: false }
jobs:
  recopilar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      # Pantallazo de la portada de cada medio: es la foto de las noticias que no traen foto propia.
      # Se parte de los anteriores: si un medio falla hoy, se queda el último bueno.
      - name: Pantallazos de las portadas
        continue-on-error: true
        run: |
          git clone -q --depth 1 -b portadas "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" /tmp/portadas || mkdir -p /tmp/portadas
          rm -rf /tmp/portadas/.git
          npm i --no-save --no-audit --no-fund playwright@1.48.2
          npx playwright install --with-deps chromium
          node scripts/espana-pantallazos.mjs /tmp/portadas
      - run: node scripts/espana-al-dia.mjs
        env: { PORTADAS_DIR: /tmp/portadas }
      - name: Guardar
        run: |
          git config user.name "patriamnews"
          git config user.email "patriamnews@users.noreply.github.com"
          git add datos/espana-al-dia.json web/espana-al-dia.js
          git diff --cached --quiet && exit 0
          git commit -m "España al día: actualización automática"
          # Si a la vez se sube otro cambio, se reintenta (antes fallaba con «cannot lock ref»)
          for i in 1 2 3 4 5; do
            git pull --rebase -q origin main && git push && exit 0
            echo "Reintento $i…"; sleep $((i * 7))
          done
          exit 1
      # Los pantallazos van a la rama «portadas», que se rehace entera cada vez (no engorda el historial de main).
      - name: Subir pantallazos
        continue-on-error: true
        run: |
          cd /tmp/portadas && ls *.jpg && git init -q -b portadas
          git config user.name "patriamnews" && git config user.email "patriamnews@users.noreply.github.com"
          git add . && git commit -q -m "Pantallazos de las portadas de los medios"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" portadas
      # Fotos originales de cada noticia, en pequeño, para la App PATRIAM (que no puede cargar fotos de otras webs).
      # Van a la rama «app-miniaturas», que se rehace entera cada vez (no engorda el historial de main).
      - name: Miniaturas para la App
        continue-on-error: true
        run: |
          npm i --no-save --no-audit --no-fund sharp@0.33.5
          node scripts/espana-miniaturas.mjs
          mkdir -p /tmp/mini && cp datos/espana-miniaturas.json /tmp/mini/
          cd /tmp/mini && git init -q -b app-miniaturas
          git config user.name "patriamnews" && git config user.email "patriamnews@users.noreply.github.com"
          git add espana-miniaturas.json && git commit -q -m "Miniaturas de España al día para la App"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" app-miniaturas
